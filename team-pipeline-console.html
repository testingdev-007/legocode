<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniFig CI/CD — Team Pipeline Console</title>
<style>
  :root{
    --bg:#000000; --panel:#171c28; --ink:#f2efe4; --muted:#9aa3b8;
    --a:#0e5fce; --gold:#ffce1f; --good:#22a559; --bad:#d4241f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    background-color:var(--bg);
    background-image:radial-gradient(circle, #1c2230 1.6px, transparent 1.6px);
    background-size:26px 26px;
    color:var(--ink);font-family:var(--sans);
  }
  #app{min-height:100%;}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--good);vertical-align:-2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--panel);border-bottom:1px solid #2a3142;flex-wrap:wrap;gap:14px;position:sticky;top:0;z-index:10;}
  .brand{font-weight:700;font-size:15px;color:var(--muted);}
  .brand b{color:var(--ink);}
  .stat{font-family:var(--mono);font-size:13px;color:var(--muted);}
  .stat b{color:var(--ink);font-size:16px;}
  .stat.good b{color:var(--good);}
  .btn{padding:9px 16px;border-radius:5px;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--sans);background:var(--a);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .1s ease, box-shadow .1s ease;}
  .btn:hover{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
  .btn:active{transform:translateY(3px);box-shadow:none;}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn.good{background:var(--good);}
  .btn.bad{background:var(--bad);}
  .btn.ghost{background:transparent;border:1px solid #333c50;color:var(--ink);box-shadow:none;}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.35;pointer-events:none;}
  .setup-wrap{max-width:420px;margin:60px auto;padding:0 20px;}
  .setup-wrap h1{font-size:26px;font-family:var(--mono);font-weight:800;}
  .setup-wrap p{color:var(--muted);line-height:1.5;}
  label.field-label{font-size:12px;color:var(--muted);display:block;margin:14px 0 5px;}
  input[type=text],input[type=number],select{width:100%;padding:10px;background:#0f1219;border:1px solid #333c50;border-radius:4px;color:var(--ink);font-family:var(--mono);font-size:13px;}
  .board{display:flex;gap:12px;padding:16px;overflow-x:auto;align-items:flex-start;}
  .column{background:var(--panel);border-radius:6px;padding:12px;flex:0 0 250px;min-height:200px;}
  .column h4{margin:0 0 4px;font-size:13px;color:var(--ink);font-family:var(--mono);}
  .column .studrow{display:flex;gap:4px;margin-bottom:6px;}
  .column .studrow span{width:7px;height:7px;border-radius:50%;}
  .column .col-sub{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.4;}
  .card{background:#0f1219;border:1px solid #2a3142;border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
  .card.incident{border-color:var(--bad);}
  .card .id{font-family:var(--mono);color:var(--muted);font-size:11px;margin-bottom:6px;}
  .card .brief{font-style:italic;color:var(--muted);font-size:12px;margin-bottom:8px;}
  .card .spec-mini{font-family:var(--mono);font-size:11.5px;line-height:1.6;margin-bottom:8px;}
  .card .spec-mini .str{color:var(--gold);}
  .card .spec-mini .changed{color:var(--bad);}
  .card .incident-tag{display:inline-block;font-size:10px;background:var(--bad);color:#fff;padding:2px 7px;border-radius:20px;margin-bottom:6px;}
  .card .actions{display:flex;gap:6px;flex-wrap:wrap;}
  details{margin:6px 0;}
  summary{cursor:pointer;font-size:11px;color:var(--a);}
  .ref-block{background:#0d0f16;border:1px solid #2a3142;border-radius:4px;padding:8px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.6;}
  .field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px;}
  .field-row label{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 66px;}
  .field-row select{flex:1;padding:5px 6px;font-size:11px;}
  .audit-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11.5px;margin-bottom:5px;}
  .audit-row .toggles{display:flex;gap:4px;}
  .toggle-btn{padding:3px 7px;font-size:10px;border-radius:3px;border:1px solid #333c50;background:#1a1f2b;color:var(--muted);cursor:pointer;}
  .toggle-btn.pass-on{background:var(--good);color:#fff;border-color:var(--good);}
  .toggle-btn.fail-on{background:var(--bad);color:#fff;border-color:var(--bad);}
  .done-empty,.col-empty{color:var(--muted);font-size:11px;text-align:center;padding:14px 0;}
  .banner{position:fixed;inset:0;background:rgba(255,206,31,.97);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;color:#141821;}
  .banner.incident-b{background:rgba(212,36,31,.97);color:#fff;}
  .banner h2{font-size:32px;margin:0 0 14px;font-family:var(--mono);}
  .banner p{font-size:15px;max-width:460px;margin:0 0 18px;}
  .final-wrap{max-width:500px;margin:60px auto;text-align:center;padding:0 20px;}
  .final-wrap .big{font-size:56px;font-weight:800;font-family:var(--mono);}
  .final-line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;margin:8px 0;text-align:left;}
  .concept-note{font-size:10.5px;color:var(--muted);border-top:1px solid #2a3142;padding-top:8px;margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const HEADGEAR = ["Bare Head","Hair","Hat","Helmet","Mask","Hood"];
const TORSO_COLORS = ["Red","Blue","Green","Yellow","Black","White","Grey","Orange"];
const ARM_COLORS = ["Red","Blue","Green","Yellow","Black","White","Grey","Orange"];
const LEG_COLORS = ["Red","Blue","Green","Yellow","Black","White","Grey","Orange"];
const ACCESSORY_TYPES = ["None","Long Item","Flat Item","Tool-shaped Item","Round Item"];
const ATTRS = [
  {key:'head', pool:HEADGEAR}, {key:'torso', pool:TORSO_COLORS}, {key:'arms', pool:ARM_COLORS},
  {key:'legs', pool:LEG_COLORS}, {key:'accessory', pool:ACCESSORY_TYPES},
];
const BRIEFS = [
  "A knight heading into battle","A scientist late for a conference","An astronaut about to launch",
  "A chef entering a competition","A detective on a stakeout","A gardener before a storm",
  "A pirate at low tide","A robot fresh off the assembly line","An explorer lost in the fog","A wizard between spells"
];
function rand(pool){ return Math.floor(Math.random()*pool.length); }
function specValue(spec,key){ return ATTRS.find(a=>a.key===key).pool[spec[key]]; }
function fmt(s){ const m=Math.floor(s/60), sec=s%60; return m+":"+String(sec).padStart(2,'0'); }

const CONCEPTS = {
  designing:"Turning a requirement into structured data — the config someone else's code will read.",
  developing:"Writing code from a spec and running it yourself — same person, write and execute.",
  testing:"Testing runs assertions against the real result — and has the authority to send it back.",
};

let S = null;

function mount(html){ document.getElementById('app').innerHTML = html; }

function renderSetup(){
  mount(`
    <div class="setup-wrap">
      <div style="font-family:var(--mono);font-size:12px;color:var(--good);margin-bottom:16px;">$ team_pipeline --init<span class="cursor"></span></div>
      <h1>Team Pipeline Console</h1>
      <p>One shared board. Items flow Backlog → Designing → Developing → Testing → Done. Rotate seats clockwise on the shift bell — the board doesn't care who's sitting where.</p>
      <label class="field-label">Team name</label>
      <input type="text" id="teamName" placeholder="e.g. The Compilers">
      <label class="field-label">Minifig sets available (parts you have)</label>
      <input type="number" id="capacity" value="10">
      <label class="field-label">Shift length (seconds) — how often to rotate</label>
      <input type="number" id="shiftSeconds" value="240">
      <label class="field-label" style="display:flex;align-items:center;gap:8px;margin-top:16px;">
        <input type="checkbox" id="virusEnabled" checked style="width:auto;">
        Enable virus crisis (random, once per session)
      </label>
      <button class="btn wide" style="margin-top:20px" onclick="startSession()">Start pipeline</button>
    </div>
  `);
}
function startSession(){
  S = {
    teamName: document.getElementById('teamName').value || 'Unnamed Team',
    capacity: parseInt(document.getElementById('capacity').value) || 10,
    shiftSeconds: parseInt(document.getElementById('shiftSeconds').value) || 240,
    shiftRemaining: 0,
    incidentRemaining: 60 + Math.floor(Math.random()*60),
    virusEnabled: document.getElementById('virusEnabled').checked,
    virusFired: false,
    virusRemaining: 180 + Math.floor(Math.random()*240),
    virusItemsLost: 0,
    cards: [],
    nextId: 1,
    score: {throughput:0, quality:0, defects:0},
    doneLog: [],
    running: true,
  };
  S.shiftRemaining = S.shiftSeconds;
  ensureBacklog();
  renderBoard();
  S.tickId = setInterval(tick, 1000);
}
function ensureBacklog(){
  const backlogCount = S.cards.filter(c=>c.stage==='backlog').length;
  for (let i=backlogCount; i<2; i++){
    S.cards.push({id:S.nextId++, brief:BRIEFS[rand(BRIEFS)], spec:{}, stage:'backlog', incidentAttr:null, sentBackCount:0, testCalls:{}});
  }
}
function tick(){
  if (!S || !S.running) return;
  S.shiftRemaining--;
  S.incidentRemaining--;
  let rotateFired = false;
  if (S.shiftRemaining <= 0){ rotateFired = true; S.shiftRemaining = S.shiftSeconds; }
  if (S.incidentRemaining <= 0){
    const developing = S.cards.filter(c=>c.stage==='developing' && !c.incidentAttr && Object.keys(c.spec).length===5);
    if (developing.length){
      const card = developing[rand(developing)];
      const attr = ATTRS[rand(ATTRS)];
      let newIdx = rand(attr.pool);
      while (newIdx === card.spec[attr.key]) newIdx = rand(attr.pool);
      card.spec[attr.key] = newIdx;
      card.incidentAttr = attr.key;
      S.incidentRemaining = 60 + Math.floor(Math.random()*80);
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type='square'; g.gain.value=0.04;
        o.frequency.value=880; o.start();
        setTimeout(()=>{o.frequency.value=440;},150);
        setTimeout(()=>{o.stop(); ctx.close();},380);
      }catch(e){}
    } else {
      S.incidentRemaining = 12;
    }
  }
  ensureBacklog();
  renderBoard();
  if (rotateFired) showRotateBanner();
  if (S.virusEnabled && !S.virusFired){
    S.virusRemaining--;
    if (S.virusRemaining <= 0){
      const eligible = S.cards.filter(c => (c.stage==='developing'||c.stage==='testing') || (c.stage==='done' && !c.recycled));
      if (eligible.length >= 2){
        fireVirus();
      } else {
        S.virusRemaining = 20;
      }
    }
  }
}
function fireVirus(){
  const eligible = S.cards.filter(c => (c.stage==='developing'||c.stage==='testing') || (c.stage==='done' && !c.recycled));
  const scoreSafe = S.score.throughput + S.score.quality + S.score.defects;
  S.cards = S.cards.filter(c => !eligible.includes(c));
  S.virusFired = true;
  S.virusItemsLost = eligible.length;
  ensureBacklog();
  renderBoard();
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type='sawtooth'; g.gain.value=0.05;
    o.frequency.value=200; o.start();
    setTimeout(()=>{o.frequency.value=90;},250);
    setTimeout(()=>{o.stop(); ctx.close();},700);
  }catch(e){}
  const el = document.createElement('div');
  el.className = 'banner incident-b';
  el.innerHTML = `
    <h2>🦠 VIRUS DETECTED</h2>
    <p>Every built figure your team currently has — mid-build or already finished and not recycled — is corrupted and has to be taken apart right now. <b>${eligible.length} item(s) lost.</b> Your score of <b>${scoreSafe}</b> is untouched.</p>
    <p style="font-size:13px;opacity:.9;max-width:440px;">This models a real disaster-recovery scenario: a live incident (like ransomware) can corrupt production and everything in flight, but a bank's audit trail of already-signed-off work sits on a separate system and survives. That's why DR and backups are a regulatory requirement in finance, not a nice-to-have.<br><b>Role:</b> Business Continuity / Disaster Recovery lead, Security Incident Response.</p>
    <button class="btn" onclick="this.parentElement.remove()">Rebuild</button>
  `;
  document.body.appendChild(el);
}
function showRotateBanner(){
  const el = document.createElement('div');
  el.className = 'banner';
  el.innerHTML = `<h2>🔁 ROTATE CLOCKWISE</h2><p>Everyone move one seat. Whatever card is at your new seat, pick up where the last person left off.</p><button class="btn ghost" style="border-color:#141821;color:#141821" onclick="this.parentElement.remove()">Got it</button>`;
  document.body.appendChild(el);
}

function cardSpecHtml(card){
  return ATTRS.map(a=>{
    const changed = card.incidentAttr===a.key;
    return `<div class="${changed?'changed':''}">${a.key}: <span class="str">"${specValue(card.spec,a.key)}"</span>${changed?' ⚠':''}</div>`;
  }).join('');
}

function renderCard(card){
  const s = card.stage;
  let inner = `<div class="id">Item #${card.id}${card.sentBackCount?' · sent back '+card.sentBackCount+'x':''}</div>`;
  if (s!=='backlog' && s!=='designing') inner += `<div class="brief">"${card.brief}"</div>`;
  if (card.incidentAttr && (s==='developing'||s==='testing')){
    inner += `<div class="incident-tag">⚠ EXCEPTION: ${card.incidentAttr}</div>`;
  }
  if (s==='backlog'){
    inner += `<div class="brief">"${card.brief}"</div><div class="actions"><button class="btn small" onclick="startDesigning(${card.id})">Start Designing →</button></div>`;
  }
  if (s==='designing'){
    inner += `<div class="brief">"${card.brief}"</div>`;
    inner += ATTRS.map(a=>`
      <div class="field-row"><label>${a.key}</label>
        <select onchange="setSpecField(${card.id},'${a.key}',this.value)">
          <option value="">choose…</option>
          ${a.pool.map((v,i)=>`<option value="${i}" ${card.spec[a.key]===i?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>`).join('');
    const complete = Object.keys(card.spec).length===5;
    inner += `<div class="actions"><button class="btn small" ${complete?'':'disabled'} onclick="sendToDeveloping(${card.id})">Send to Developing →</button></div>`;
  }
  if (s==='developing'){
    inner += `<div class="spec-mini">${cardSpecHtml(card)}</div>
      <details><summary>Syntax reference</summary>
        <div class="ref-block">attach(legs, spec.legs)<br>attach(torso, spec.torso)<br>attach(arms, spec.arms)<br>attach(head, spec.head)<br>if spec.accessory != "None":<br>&nbsp;&nbsp;attach(accessory, spec.accessory)</div>
      </details>
      <div class="actions"><button class="btn small" onclick="sendToTesting(${card.id})">Send to Testing →</button></div>`;
  }
  if (s==='testing'){
    inner += `<div class="spec-mini">${cardSpecHtml(card)}</div>`;
    inner += ATTRS.map(a=>{
      const call = card.testCalls[a.key];
      return `<div class="audit-row"><span>${a.key}: "${specValue(card.spec,a.key)}"</span>
        <span class="toggles">
          <span class="toggle-btn ${call==='pass'?'pass-on':''}" onclick="setTestCall(${card.id},'${a.key}','pass')">PASS</span>
          <span class="toggle-btn ${call==='fail'?'fail-on':''}" onclick="setTestCall(${card.id},'${a.key}','fail')">FAIL</span>
        </span></div>`;
    }).join('');
    const allSet = ATTRS.every(a=>card.testCalls[a.key]);
    const anyFail = ATTRS.some(a=>card.testCalls[a.key]==='fail');
    inner += `<div class="actions">
      <button class="btn small good" ${allSet?'':'disabled'} onclick="markDone(${card.id})">Mark Done ✅</button>
      <button class="btn small bad" ${(allSet&&anyFail)?'':'disabled'} onclick="sendBack(${card.id})">Send back (+1)</button>
    </div>`;
  }
  if (s==='done'){
    inner += `<div style="color:var(--good);font-size:11px;">+1 throughput, +${card.qualityPoints} quality</div>`;
    if (card.recycled){
      inner += `<div style="color:var(--muted);font-size:11px;margin-top:4px;">♻ parts recycled</div>`;
    } else {
      inner += `<div class="actions" style="margin-top:6px;"><button class="btn small ghost" onclick="recycleCard(${card.id})">♻ Recycle parts</button></div>`;
    }
  }
  return `<div class="card ${card.incidentAttr?'incident':''}">${inner}</div>`;
}

function capacityInUse(){
  return S.cards.filter(c => (c.stage==='developing'||c.stage==='testing') || (c.stage==='done' && !c.recycled)).length;
}
function getCard(id){ return S.cards.find(c=>c.id===id); }
function startDesigning(id){ getCard(id).stage='designing'; renderBoard(); }
function setSpecField(id,key,val){ getCard(id).spec[key] = val===''?undefined:parseInt(val); if (getCard(id).spec[key]===undefined) delete getCard(id).spec[key]; renderBoard(); }
function sendToDeveloping(id){
  if (capacityInUse() >= S.capacity){
    alert('No free parts — recycle a completed build first (see the Done column).');
    return;
  }
  getCard(id).stage='developing'; renderBoard();
}
function sendToTesting(id){ getCard(id).stage='testing'; renderBoard(); }
function setTestCall(id,key,call){ getCard(id).testCalls[key] = call; renderBoard(); }
function sendBack(id){
  const c = getCard(id);
  c.stage='developing'; c.sentBackCount++; c.testCalls={};
  S.score.defects++;
  renderBoard();
}
function markDone(id){
  const c = getCard(id);
  const qualityPoints = ATTRS.filter(a=>c.testCalls[a.key]==='pass').length;
  c.qualityPoints = qualityPoints;
  c.stage = 'done';
  S.score.throughput += 1;
  S.score.quality += qualityPoints;
  S.doneLog.unshift(c);
  renderBoard();
}
function recycleCard(id){
  getCard(id).recycled = true;
  renderBoard();
}

const COLUMNS = [
  {key:'backlog', label:'Backlog', sub:'New briefs waiting to be picked up.', color:'#565f75'},
  {key:'designing', label:'Designing', sub:CONCEPTS.designing, color:'var(--a)'},
  {key:'developing', label:'Developing', sub:CONCEPTS.developing, color:'var(--gold)'},
  {key:'testing', label:'Testing', sub:CONCEPTS.testing, color:'var(--good)'},
  {key:'done', label:'Done', sub:'Scored and complete. Recycle to free parts for the next item.', color:'#565f75'},
];

function renderBoard(){
  const total = S.score.throughput + S.score.quality + S.score.defects;
  const inUse = capacityInUse();
  mount(`
    <div class="topbar">
      <div class="brand"><b>${S.teamName}</b> — Pipeline Console<span class="cursor"></span></div>
      <div class="stat">Rotate in <b>${fmt(S.shiftRemaining)}</b></div>
      <div class="stat ${inUse>=S.capacity?'':''}" style="${inUse>=S.capacity?'color:var(--bad);':''}">Parts <b>${inUse}/${S.capacity}</b></div>
      <div class="stat good">Score <b>${total}</b></div>
      <div class="stat">T:${S.score.throughput} · Q:${S.score.quality} · Caught:${S.score.defects}</div>
      <button class="btn ghost small" onclick="endSession()">End session</button>
    </div>
    <div class="board">
      ${COLUMNS.map(col=>{
        const cards = S.cards.filter(c=>c.stage===col.key);
        const list = col.key==='done'
          ? (cards.length ? cards.slice(0,6).map(renderCard).join('') : `<div class="done-empty">No items done yet.</div>`)
          : (cards.length ? cards.map(renderCard).join('') : `<div class="col-empty">Empty</div>`);
        return `<div class="column" style="border-top:3px solid ${col.color}">
          <div class="studrow"><span style="background:${col.color}"></span><span style="background:${col.color}"></span><span style="background:${col.color}"></span></div>
          <h4>${col.label}</h4><div class="col-sub">${col.sub}</div>${list}</div>`;
      }).join('')}
    </div>
  `);
}
function endSession(){
  clearInterval(S.tickId);
  S.running = false;
  const total = S.score.throughput + S.score.quality + S.score.defects;
  const recycles = S.cards.filter(c=>c.recycled).length;
  mount(`
    <div class="final-wrap">
      <h1>Session complete</h1>
      <div class="big">${total}</div>
      <p style="color:var(--muted)">Report this to your leaderboard as: <b>${S.teamName}</b> — <b>${total}</b> points</p>
      <div style="text-align:left;max-width:280px;margin:20px auto 0;">
        <div class="final-line"><span>Throughput (items done)</span><span>${S.score.throughput}</span></div>
        <div class="final-line"><span>Quality (fields passed)</span><span>${S.score.quality}</span></div>
        <div class="final-line"><span>Defects caught by Testing</span><span>${S.score.defects}</span></div>
        <div class="final-line"><span>Parts sets recycled</span><span>${recycles}</span></div>
        ${S.virusFired ? `<div class="final-line" style="color:var(--bad);"><span>Virus crisis hit</span><span>-${S.virusItemsLost} item(s)</span></div>` : ''}
      </div>
      <div class="concept-note" style="max-width:320px;margin:20px auto 0;text-align:left;">Throughput + Quality + Defects Caught — real delivery teams are measured on all three, not just speed. That's an Engineering Manager or Delivery Lead's dashboard.</div>
    </div>
  `);
}

renderSetup();
</script>
</body>
</html>
